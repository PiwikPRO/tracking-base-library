name: Bump NPM Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver level to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@64ed1c7eab4cce3362f8c340dee64e5eaeef8f7c
        with:
          node-version: '24.22.1'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PiwikPRO/actions
          ref: 1c113aa2675ac4dc8a28c2c1b4c03b6bec93a2fd
          token: ${{ secrets.ACTIONS_READ_TOKEN }}
          path: .shared-actions
          persist-credentials: false
          sparse-checkout: javascript/npm-bump

      - name: Bump NPM package version
        uses: ./.shared-actions/javascript/npm-bump
        with:
          version: ${{ inputs.version }}
